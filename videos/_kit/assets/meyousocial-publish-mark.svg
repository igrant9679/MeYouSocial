<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-label="MeYouSocial Publish">
  <!-- MeYouSocial Publish — the family mark (ink badge #15181D, white left fold, coral #E5482F right fold: the folded-broadsheet M)
       plus the product chip: a white disc at the corner, ink-ringed, carrying a coral "out into the world" arrow.
       Sibling apps keep the M and swap the chip's glyph. -->
  <rect width="520" height="520" rx="110" fill="#15181D"/>
  <path d="M90 410 V140 L225 320 L270 255 V410 Z" fill="#FFFFFF"/>
  <path d="M270 255 L315 320 L430 140 V410 H345 V280 Z" fill="#E5482F"/>
  <circle cx="418" cy="418" r="86" fill="#FFFFFF" stroke="#15181D" stroke-width="16"/>
  <g fill="none" stroke="#E5482F" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M386 450 L450 386"/>
    <path d="M404 386 H450 V432"/>
  </g>
</svg>
