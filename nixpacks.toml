# Chrome for free local branded-short rendering ON Railway (instead of paying
# HeyGen credits). `aptPkgs` is ADDITIVE — it installs Chrome's shared-library
# dependencies on top of the auto-detected Node toolchain, so the Node/Prisma/
# Next build is untouched. The Chrome binary itself is a pinned Chrome-for-
# Testing download in the build command (see railway.json) — apt's `chromium`
# on Ubuntu is a snap shim that won't launch in a container, so we don't use it.
#
# ffmpeg for the render comes from the ffmpeg-static npm dependency (FFMPEG_PATH),
# already present. If a build fails on a package name (Ubuntu jammy vs noble
# renamed a few libs with a t64 suffix), the failed build does NOT affect the
# running site — fix the name from the build log and redeploy.
# Package names are for Ubuntu 24.04 "noble" — the Nixpacks base
# (ghcr.io/railwayapp/nixpacks:ubuntu). Noble's t64 ABI transition renamed
# several libs with a `t64` suffix (libasound2 -> libasound2t64, etc.); this is
# the Playwright/Chrome noble dependency set. If Railway ever moves the base off
# noble these names change — but a failed build can't take the site down.
[phases.setup]
aptPkgs = [
  # unzip is required to EXTRACT the Chrome download (`hyperframes browser
  # ensure`); the noble base ships none, so the download succeeded but
  # extraction failed. This was the real blocker.
  "unzip",
  # ffmpeg provides ffprobe, which HyperFrames' render needs and ffmpeg-static
  # does not ship (the app's own video assembly keeps using ffmpeg-static).
  "ffmpeg",
  "fonts-liberation",
  "libnss3",
  "libnspr4",
  "libasound2t64",
  "libatk1.0-0t64",
  "libatk-bridge2.0-0t64",
  "libatspi2.0-0t64",
  "libcups2t64",
  "libglib2.0-0t64",
  "libgtk-3-0t64",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libpango-1.0-0",
  "libcairo2",
  "libx11-6",
  "libxcb1",
  "libxext6"
]

# Cache the HyperFrames Chrome download (~114MB) across builds so it isn't
# re-fetched every deploy. A cache mount is EPHEMERAL (its contents never land in
# the image), so the build command copies Chrome out of this cached dir into
# /app/.chrome — a real image layer — before capturing the path. If the mount
# ever fails to engage the copy still works from a normal dir, so the build never
# breaks; it just re-downloads that time.
#
# ⚠ The Chrome step itself CAN break the build, and did: on 2026-11-18 two of four
# deploys died right after `npx --yes hyperframes@0.7.71 browser ensure` began,
# with the app already built and no error text in the log (exit code 1, about
# four seconds after npx had installed the tool). So railway.json tries that one
# step up to three times (10 s, then 30 s apart) and prints each failure's exit
# code — search a failed build log for "chrome step failed". The LAST try first
# empties this cache folder (`find … -mindepth 1 -delete`, which leaves the mount
# point itself): every try in one build sees the same cached copy, so a broken
# one would otherwise fail three times running. That try downloads Chrome
# afresh (~114MB) and refills the cache for the builds after it. The
# parentheses around the retry in railway.json are load-bearing: without them a
# failed `npm run build` would fall through to the retry's `||`. Three failures
# still fail the build, on purpose: a site without Chrome would send branded
# shorts to the paid cloud renderer without anyone having decided that.
[phases.build]
cacheDirectories = ["/root/.cache/hyperframes"]
