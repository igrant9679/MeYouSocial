# Chrome for free local branded-short rendering ON Railway (instead of paying
# HeyGen credits). `aptPkgs` is ADDITIVE — it installs Chrome's shared-library
# dependencies on top of the auto-detected Node toolchain, so the Node/Prisma/
# Next build is untouched. The Chrome binary itself is a pinned Chrome-for-
# Testing download in the build command (see railway.json) — apt's `chromium`
# on Ubuntu is a snap shim that won't launch in a container, so we don't use it.
#
# ffmpeg for the render comes from the ffmpeg-static npm dependency (FFMPEG_PATH),
# already present. If a build fails on a package name (Ubuntu jammy vs noble
# renamed a few libs with a t64 suffix), the failed build does NOT affect the
# running site — fix the name from the build log and redeploy.
# Package names are for Ubuntu 24.04 "noble" — the Nixpacks base
# (ghcr.io/railwayapp/nixpacks:ubuntu). Noble's t64 ABI transition renamed
# several libs with a `t64` suffix (libasound2 -> libasound2t64, etc.); this is
# the Playwright/Chrome noble dependency set. If Railway ever moves the base off
# noble these names change — but a failed build can't take the site down.
[phases.setup]
aptPkgs = [
  # unzip is required to EXTRACT the Chrome download (`hyperframes browser
  # ensure`); the noble base ships none, so the download succeeded but
  # extraction failed. This was the real blocker.
  "unzip",
  # ffmpeg provides ffprobe, which HyperFrames' render needs and ffmpeg-static
  # does not ship (the app's own video assembly keeps using ffmpeg-static).
  "ffmpeg",
  "fonts-liberation",
  "libnss3",
  "libnspr4",
  "libasound2t64",
  "libatk1.0-0t64",
  "libatk-bridge2.0-0t64",
  "libatspi2.0-0t64",
  "libcups2t64",
  "libglib2.0-0t64",
  "libgtk-3-0t64",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libpango-1.0-0",
  "libcairo2",
  "libx11-6",
  "libxcb1",
  "libxext6"
]
