<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="400" viewBox="0 0 1320 400" role="img" aria-label="MeYouSocial Publish">
  <!-- Horizontal lockup, light backgrounds: the Publish mark with the family wordmark (ink, bold) over the product name (coral).
       Type is IBM Plex Mono, the app's own face; falls back to a system monospace where it is not installed. -->
  <g transform="translate(60 70) scale(0.5)">
    <rect width="520" height="520" rx="110" fill="#15181D"/>
    <path d="M90 410 V140 L225 320 L270 255 V410 Z" fill="#FFFFFF"/>
    <path d="M270 255 L315 320 L430 140 V410 H345 V280 Z" fill="#E5482F"/>
    <circle cx="418" cy="418" r="86" fill="#FFFFFF" stroke="#15181D" stroke-width="16"/>
    <g fill="none" stroke="#E5482F" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M386 450 L450 386"/>
      <path d="M404 386 H450 V432"/>
    </g>
  </g>
  <g font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace">
    <text x="380" y="192" font-size="128" font-weight="700" letter-spacing="-4" fill="#15181D">MeYouSocial</text>
    <text x="380" y="328" font-size="128" font-weight="500" letter-spacing="-4" fill="#E5482F">Publish</text>
  </g>
</svg>
